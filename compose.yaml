services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhconstruct}
      POSTGRES_USER: ${POSTGRES_USER:-zhconstruct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhconstruct}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhconstruct} -d ${POSTGRES_DB:-zhconstruct}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-zhconstruct}
      POSTGRES_USER: ${POSTGRES_USER:-zhconstruct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhconstruct}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_ASSISTANT_API_TIMEOUT: ${AI_ASSISTANT_API_TIMEOUT:-3}
      AI_ASSISTANT_ALLOW_FALLBACK: ${AI_ASSISTANT_ALLOW_FALLBACK:-true}
    volumes:
      - ./backend:/app
      # Макет входа коллег хранит общие изображения в корне репозитория.
      # Монтируем их только для чтения, чтобы Django мог использовать тот же ассет.
      - ./assets:/assets:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
