{% extends 'resident_portal/base.html' %}
{% block title %}Новое обращение{% endblock %}
{% block content %}
  <a class="back-link" href="{% url 'resident_portal:tickets' %}">← Обращения</a><div class="page-heading"><p class="eyebrow">НОВОЕ ОБРАЩЕНИЕ</p><h1>Что случилось?</h1><p>Опишите проблему — система направит её ответственному.</p></div>
  <form method="post" class="surface form-stack">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.errors %}<small class="field-error">{{ field.errors|striptags }}</small>{% endif %}</label>{% endfor %}<button class="button primary wide" type="submit">Отправить обращение</button></form>
{% endblock %}
